<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Fondo Vivo CORFO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
/* Layout: riel de proyectos + lienzo de trabajo. Elemento firma: "reloj de fondos" (tiempo vs dinero). Paleta CSLAB, siempre clara. */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunk:#eef3f6; --line:#d3dde3;
  --fg:#1f4e6b; --muted:#5a7d91; --faint:#8fa8b6;
  --ink:#ffffff; --on-ink:#2f7fb0; --ink-line:#3f8ebf;
  --copper:#3f8ebf; --cyan:#55b4d4; --copper-soft:#dcedf6;
  --ok:#1f7a4d; --ok-soft:#dcefe4;
  --warn:#a86a00; --warn-soft:#f8ebcc;
  --crit:#b3261e; --crit-soft:#f8dcd9;
  --info:#2c5d8f; --info-soft:#dde8f3;
  --shadow:0 1px 2px rgba(31,78,107,.06),0 10px 28px rgba(31,78,107,.10);
  --f-display:"Roboto",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Roboto",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:500}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.subtle{color:var(--muted)}

.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 16px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ink);border:1.5px solid var(--ink-line);display:grid;place-items:center;flex:none}
.brand b{font-size:17px;font-weight:900;letter-spacing:-.02em;display:block;line-height:1.1}
.brand span{font-size:12px;color:var(--muted)}
.navbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:9px 10px;border-radius:8px;border:0;background:transparent;cursor:pointer}
.navbtn:hover,.navbtn[aria-current="true"]{background:var(--sunk)}
.navbtn[aria-current="true"]{font-weight:500}
.plist{display:flex;flex-direction:column;gap:2px}
.pitem{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border-radius:8px;border:0;background:transparent;cursor:pointer;text-align:left;width:100%}
.pitem:hover,.pitem[aria-current="true"]{background:var(--sunk)}
.pitem .nm{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem small{display:block;color:var(--muted);font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.crit{background:var(--crit)}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}

.main{padding-block:24px 64px;padding-inline:clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:22px;min-width:0}
.topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:clamp(21px,2.4vw,28px);font-weight:700;max-width:46ch}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);border-color:var(--ink-line);color:var(--on-ink);font-weight:500}
.btn.primary:hover{background:var(--copper-soft)}
.btn.solid{background:var(--copper);border-color:var(--copper);color:#fff}
.btn.solid:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:5px 10px;font-size:13px}
.iconbtn{width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative}
.badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--crit);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--f-mono)}
.meta{display:flex;gap:6px 18px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}
.meta b{color:var(--fg);font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.panel-h h2{font-size:17px;font-weight:700}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-size:clamp(20px,2.2vw,27px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.crit .v{color:var(--crit)}.kpi.copper .v{color:var(--copper)}

.clock{display:grid;gap:14px}
.track{display:grid;grid-template-columns:90px minmax(0,1fr) 130px;gap:12px;align-items:center}
.track .lbl{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.bar{height:14px;border-radius:7px;background:var(--sunk);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:7px}
.bar.time i{background:linear-gradient(90deg,var(--muted),var(--fg))}
.bar.money i{background:linear-gradient(90deg,var(--copper),var(--cyan))}
.bar .plan{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.6}
.track .val{text-align:right;font-family:var(--f-mono);font-size:13px}
.verdict{padding:14px 16px;border-radius:8px}
.verdict.crit{background:var(--crit-soft)}.verdict.warn{background:var(--warn-soft)}.verdict.ok{background:var(--ok-soft)}.verdict.mute{background:var(--sunk)}
.verdict b{font-size:16px;display:block}
.verdict p{margin:2px 0 0}

.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.chart{width:100%;overflow-x:auto}
.chart svg{width:100%;min-width:540px;height:auto;display:block}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;display:inline-block}

.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:4px minmax(0,1fr);gap:12px;padding:10px 12px 10px 0;border-radius:8px;background:var(--sunk)}
.alert::before{content:"";border-radius:4px;background:var(--faint)}
.alert.crit::before{background:var(--crit)}.alert.warn::before{background:var(--warn)}.alert.info::before{background:var(--info)}
.alert b{display:block;font-weight:500}
.alert span{color:var(--muted);font-size:13px}
.alert .pj{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.alerts.scroll{max-height:520px;overflow:auto;padding-right:4px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.info{background:var(--info-soft);color:var(--info)}
.pill.mute{background:var(--sunk);color:var(--muted)}

.vnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:-6px;padding-top:4px}
.vtab{padding:11px 14px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-weight:500;font-size:14px;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.vtab:hover{color:var(--fg)}
.vtab[aria-selected="true"]{color:var(--fg);border-color:var(--copper)}
.vtab .cnt{font-family:var(--f-mono);font-size:11px;background:var(--sunk);color:var(--muted);border-radius:10px;padding:1px 7px}
.vtab .cnt.hot{background:var(--crit-soft);color:var(--crit)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--ink-line);background:#fff;color:var(--on-ink);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:500;cursor:pointer}
.chip:hover{background:var(--copper-soft)}
.subnav{display:flex;flex-direction:column;gap:1px;margin:2px 0 6px 28px;border-left:1px solid var(--line);padding-left:8px}
.subnav button{border:0;background:transparent;text-align:left;padding:5px 8px;border-radius:6px;cursor:pointer;color:var(--muted);font-size:13px}
.subnav button:hover{background:var(--sunk);color:var(--fg)}
.subnav button[aria-current="true"]{color:var(--fg);font-weight:500;background:var(--copper-soft)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tab{padding:10px 14px;border:0;background:transparent;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-color:var(--cyan)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:left;font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td:first-child{min-width:240px}
td:nth-child(2){min-width:130px}
tr.cat td{background:var(--sunk);font-weight:500;cursor:pointer}
tr.cat td:first-child{border-radius:6px 0 0 6px}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--sunk)}
.lname{font-weight:500;line-height:1.3}
.lname small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.mini{height:7px;border-radius:4px;background:var(--sunk);position:relative;min-width:90px}
tr.cat .mini{background:#fff}
.mini i{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--copper)}
.mini b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.55}
.mini.behind i{background:var(--warn)}.mini.over i{background:var(--crit)}
.chev{display:inline-block;width:14px;transition:transform .15s}
.collapsed .chev{transform:rotate(-90deg)}

/* gantt */
.gantt{overflow-x:auto}
.gin{min-width:860px;display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:260px minmax(0,1fr) 92px;gap:14px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.ghead{display:grid;grid-template-columns:260px minmax(0,1fr) 92px;gap:14px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-bottom:6px;border-bottom:1px solid var(--line)}
.gobj{padding:12px 0 6px;font-weight:700;font-size:13px;color:var(--fg);display:flex;gap:10px;align-items:baseline}
.gobj span{color:var(--muted);font-weight:400;font-size:12px}
.tn{font-weight:500;line-height:1.3;font-size:13px}
.tn small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.lane{position:relative;height:24px}
.ygrid{position:absolute;top:-8px;bottom:-8px;width:1px;background:var(--line)}
.tbar{position:absolute;top:3px;height:18px;border-radius:5px;background:var(--info-soft);border:1px solid var(--copper);overflow:hidden;cursor:pointer;padding:0}
.tbar i{position:absolute;inset:0 auto 0 0;background:var(--copper)}
.tbar.done{border-color:var(--ok);background:var(--ok-soft)}.tbar.done i{background:var(--ok)}
.tbar.late{border-color:var(--crit);background:var(--crit-soft)}.tbar.late i{background:var(--crit)}
.tbar.future{border-style:dashed;background:transparent}
.today{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--crit);z-index:2}
.months{position:relative;height:18px}
.months span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}

.empty{display:grid;place-items:center;text-align:center;padding:56px 20px;gap:14px}
.empty h2{font-size:22px}
.empty p{color:var(--muted);max-width:52ch;margin:0}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:8px;padding:10px 12px}

.scrim{position:fixed;inset:0;background:rgba(31,78,107,.28);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px}
.modal h3{font-size:19px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 10px;width:100%}
.field textarea{resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--cyan);outline-offset:0;border-color:transparent}
.field .hint{font-size:12px;color:var(--faint)}
.mfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.mfoot .right{display:flex;gap:8px;margin-left:auto}
.ferr{color:var(--crit);font-size:13px;min-height:1em}
.sumgrid{display:grid;grid-template-columns:1fr auto;gap:6px 16px;font-size:13px}
.sumgrid .t{font-weight:700;border-top:1px solid var(--line);padding-top:6px}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:51;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.drawer .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.drawer .alerts{overflow:auto}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:#fff;padding:11px 16px;border-radius:10px;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px);font-weight:500}
.sep{height:1px;background:var(--line)}
.authwrap{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,#fff 0%,var(--sunk) 100%)}
.authcard{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:28px}
.aform{display:flex;flex-direction:column;gap:12px}
.aform input{border:1px solid var(--line);border-radius:8px;padding:10px 11px;width:100%}
.aform .btn{justify-content:center;padding:10px}
.alinks{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}
.alinks button{border:0;background:none;color:var(--on-ink);cursor:pointer;padding:0;font-size:13px}
.alinks button:hover{text-decoration:underline}
.ro .btn.solid,.ro .btn.primary,.ro [data-l],.ro [data-gl],.ro #editP,.ro #btnImportRail,.ro #btnNewRail{display:none!important}

@media (max-width:1080px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .plist{flex-direction:row;overflow-x:auto;gap:6px}
  .pitem{width:auto;min-width:200px;background:var(--sunk)}
  .rail-foot{display:none}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--ink-line);background:#fff;color:var(--on-ink);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:500;cursor:pointer}
.chip:hover{background:var(--copper-soft)}
.subnav{display:none}
  .track{grid-template-columns:64px minmax(0,1fr) 100px}
  .form{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.bar i,.mini i{transition:width .6s cubic-bezier(.2,.7,.2,1)}}
</style>
</head><body>


<div id="auth" class="authwrap" hidden><div class="authcard" id="authBox"></div></div>
<div class="app" id="appRoot" hidden>
  <aside class="rail">
    <div class="brand">
      <div class="mark"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7.5" stroke="var(--on-ink)" stroke-width="1.8"/><path d="M10 10V4.5" stroke="var(--on-ink)" stroke-width="1.8" stroke-linecap="round"/><path d="M10 10l4 2.5" stroke="var(--cyan)" stroke-width="1.8" stroke-linecap="round"/></svg></div>
      <div><b>Fondo Vivo</b><span>CSLAB · Fondos CORFO</span></div>
    </div>
    <button class="navbtn" id="navCartera" aria-current="true">Cartera de proyectos <span class="num subtle" id="navCount">0</span></button>
    <div>
      <div class="eyebrow" style="padding:0 10px 6px">Proyectos</div>
      <div class="plist" id="plist"></div>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn solid" id="btnImportRail">Importar Excel CORFO</button>
      <button class="btn" id="btnNewRail">+ Proyecto en blanco</button>
    </div>
    <div class="rail-foot">
      <div id="userBox"></div>
      <div id="syncState">Conectando…</div>
      <div>Las alertas comparan lo ejecutado con el plan de cada cuenta presupuestaria y con el tiempo del convenio.</div>
    </div>
  </aside>
  <main class="main" id="main">
    <div class="empty"><h2>Cargando proyectos…</h2><p>Conectando con la base de datos compartida del equipo.</p></div>
  </main>
</div>
<input type="file" id="fileXlsx" accept=".xlsx,.xls,.xlsm" hidden>
<div id="layer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* Lector de la plantilla de postulación CORFO (Excel). Devuelve un proyecto listo para la plataforma. */
function parseCorfoWorkbook(XLSX, wb, fileName){
  const norm=s=>String(s==null?"":s).replace(/\s+/g," ").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  const pad=n=>String(n).padStart(2,"0");
  const isoOf=v=>{
    if(v==null||v==="")return "";
    if(v instanceof Date&&!isNaN(v))return v.getFullYear()+"-"+pad(v.getMonth()+1)+"-"+pad(v.getDate());
    if(typeof v==="number"){const d=XLSX.SSF.parse_date_code(v);return d?d.y+"-"+pad(d.m)+"-"+pad(d.d):""}
    const m=String(v).match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})/);if(m)return m[3]+"-"+pad(m[2])+"-"+pad(m[1]);
    const m2=String(v).match(/(\d{4})-(\d{2})-(\d{2})/);return m2?m2[0]:"";
  };
  const num=v=>{if(typeof v==="number")return v;const n=parseFloat(String(v||"").replace(/\./g,"").replace(",","."));return isFinite(n)?n:0};
  const sheet=name=>{const k=wb.SheetNames.find(n=>norm(n)===norm(name))||wb.SheetNames.find(n=>norm(n).startsWith(norm(name)));return k?wb.Sheets[k]:null};
  const grid=ws=>ws?XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:true}):[];
  // Tabla: encuentra la fila de encabezados que contiene todos los textos pedidos (comparación por prefijo) y devuelve filas como objetos
  function table(rows,heads,stop){
    for(let r=0;r<rows.length;r++){
      const row=rows[r]||[];const idx={};
      for(const h of heads){const c=row.findIndex(x=>x!=null&&norm(x).startsWith(norm(h)));if(c<0)break;idx[h]=c}
      if(Object.keys(idx).length!==heads.length)continue;
      const out=[];

        const txt=rr.map(x=>x==null?"":norm(x)).join(" ");
        if(stop&&stop(rr,txt))break;
        const o={_row:rr};for(const h of heads)o[h]=rr[idx[h]];out.push(o)}

  table(grid(sheet("Objetivos especificos")),["N°","Descripción de objetivo"]).forEach(o=>{if(o["N°"]!=null&&o["Descripción de objetivo"])P.objetivos.push({n:num(o["N°"]),nombre:String(o["Descripción de objetivo"]).trim()})});
  // Gantt
  const G=grid(sheet("Gantt I+D"));
  for(const row of G){if(!row)continue;row.forEach((c,i)=>{const t=norm(c);if(t==="fecha inicio"&&!P.inicio)P.inicio=isoOf(row[i+1]);if((t==="fecha termino"||t==="fecha término")&&!P.fin)P.fin=isoOf(row[i+1])})}
  let hr=G.findIndex(r=>r&&r.some(x=>norm(x).startsWith("n° actividad")||norm(x).startsWith("no actividad")));
  if(hr>=0){
    const H=G[hr],namesRow=G[hr-1]||[];

    const cN=ci("n° actividad")>=0?ci("n° actividad"):ci("no actividad"),cNom=ci("nombre actividad"),cJ=ci("justificacion"),cI=ci("fecha inicio"),cF=ci("fecha termino");
    const cTot=ci("total horas");

  let k=0;const id=p=>p+(++k);
  const isTotal=t=>/^total|subtotal/.test(t);
  // Recursos humanos
  table(grid(sheet("Recursos Humanos")),["Nombre","Rol","Valor hora","Nº de horas","Monto presentado"],(rr,t)=>t.startsWith("total")).forEach(o=>{

    if(!cargo){if(num(o["Monto inversión"]))P.excluidos.push(nom+" ("+Math.round(num(o["Monto inversión"])).toLocaleString("es-CL")+", sin valor con cargo al proyecto)");return}
    P.lineas.push({id:id("in"),cat:/infra/i.test(grupo)?"Infraestructura":"Equipamiento",grupo,nombre:nom,valorUnit:num(o["Valor unitario"]),cantidad:num(o["Cantidad requerida"]),unidad:"unidades",montoInversion:Math.round(num(o["Monto inversión"])),monto:Math.round(cargo),plan:{tipo:"cuotas",n:cuotas||1,primera:""}});
  });
  // Gastos directos
  table(grid(sheet("Gastos Directos")),["Nombre del gasto","Ítem","Valor unitario","Cantidad requerida","Unidad de medida","Monto presentado"],(rr,t)=>t.startsWith("total")).forEach(o=>{
    const m=num(o["Monto presentado"]);if(!o["Nombre del gasto"]||!m)return;
    P.lineas.push({id:id("gd"),cat:"Gastos directos",grupo:String(o["Ítem"]||"Otros").trim(),nombre:String(o["Nombre del gasto"]).trim(),valorUnit:num(o["Valor unitario"]),cantidad:num(o["Cantidad requerida"]),unidad:String(o["Unidad de medida"]||"").trim().toLowerCase(),monto:Math.round(m),plan:{tipo:"mensual"}});
  });
  // Subcontratos
  table(grid(sheet("Subcontratos")),["Entidad subcontratada","Actividades","Monto presentado"],(rr,t)=>t.startsWith("total")).forEach(o=>{
    const m=num(o["Monto presentado"]);if(!m)return;
    P.lineas.push({id:id("sc"),cat:"Contratos con personas jurídicas",grupo:String(o["Entidad subcontratada"]||"Subcontrato").trim(),nombre:String(o["Actividades"]||"Subcontrato").trim(),monto:Math.round(m),plan:{tipo:"mensual"}});
  });
  // Otros gastos
  grupo="";
  table(grid(sheet("Otros Gastos")),["Ítem","Empresa","Nombre del gasto","Valor unitario","Cantidad requerida","Monto presentado"],(rr,t)=>t.includes("total otros gastos")).forEach(o=>{
    if(o["Ítem"])grupo=String(o["Ítem"]).trim();
    const m=num(o["Monto presentado"]);const nom=o["Nombre del gasto"]?String(o["Nombre del gasto"]).trim():"";if(!nom||!m||isTotal(norm(nom)))return;
    const g=norm(grupo);const cat=g.startsWith("arriendo")?"Arriendo de bienes":g.startsWith("propiedad")?"Constitución de derechos":"Gastos básicos";
    P.lineas.push({id:id("og"),cat,grupo,nombre:nom,valorUnit:num(o["Valor unitario"]),cantidad:num(o["Cantidad requerida"]),unidad:"mes",monto:Math.round(m),plan:{tipo:"mensual"}});
  });
  // Primera cuota de inversiones: 3 meses después del inicio (compra al inicio del proyecto)
  if(P.inicio){const [y,mo]=P.inicio.split("-").map(Number);const d=new Date(y,mo-1+3,0);const f=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());P.lineas.forEach(l=>{if(l.plan.tipo==="cuotas")l.plan.primera=f})}
  const base=String(fileName||"").replace(/\.[^.]+$/,"").replace(/[_]+/g," ").trim();
  P.nombre=base||"Proyecto CORFO";
  return P;
}

/* ---------- métricas ---------- */
const MCACHE=new Map();
function metrics(p){
  const key=p.id+":"+(p.actualizado||"")+":"+JSON.stringify([(p.lineas||[]).length,(p.gastos||[]).length,(p.actividades||[]).length]);
  const c=MCACHE.get(p.id);if(c&&c.key===key)return c.m;
  const m=computeMetrics(p);MCACHE.set(p.id,{key,m});return m;
}
function computeMetrics(p){
  const S=toD(p.inicio)||TODAY,E=toD(p.fin)||addMonths(S,12);
  const span=Math.max(1,days(S,E)+1);
  const elapsed=clamp(days(S,TODAY)+1,0,span),remaining=Math.max(0,days(TODAY,E)),ended=TODAY>E;
  const lin=(a,b,d)=>clamp((days(a,d)+1)/Math.max(1,days(a,b)+1),0,1);
  const acts=(p.actividades||[]).filter(a=>toD(a.inicio)&&toD(a.fin));
  const hTot=acts.reduce((s,a)=>s+(+a.horas||0),0);
  const ganttFrac=d=>hTot?acts.reduce((s,a)=>s+(+a.horas||0)*lin(toD(a.inicio),toD(a.fin),d),0)/hTot:lin(S,E,d);
  const cuotaDates=l=>{const n=Math.max(1,(+l.plan.n)|0),f=toD(l.plan.primera)||S;const out=[];for(let i=0;i<n;i++){let d=addMonths(f,12*i);if(d>E)d=E;out.push(d)}return out};
  const lines=p.lineas||[];
  const planLine=(l,d)=>{const M=+l.monto||0,t=(l.plan||{}).tipo||"mensual";
    if(t==="cuotas"){const ds=cuotaDates(l);return M*ds.filter(x=>x<=d).length/ds.length}
    if(t==="unico"){const f=toD(l.plan.fecha)||S;return d>=f?M:0}
    if(t==="gantt")return M*ganttFrac(d);
    return M*lin(toD(l.plan.desde)||S,toD(l.plan.hasta)||E,d)};
  const lineEnd=l=>{const t=(l.plan||{}).tipo;if(t==="cuotas"){const ds=cuotaDates(l);return ds[ds.length-1]}if(t==="unico")return toD(l.plan.fecha)||S;if(t==="gantt")return acts.length?acts.map(a=>toD(a.fin)).sort((a,b)=>b-a)[0]:E;return toD(l.plan.hasta)||E};
  const total=lines.reduce((s,l)=>s+(+l.monto||0),0);
  const gastos=(p.gastos||[]).slice().sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  const spent={};let actual=0;
  for(const g of gastos){if(toD(g.fecha)>TODAY)continue;const v=+g.monto||0;actual+=v;spent[g.lineaId]=(spent[g.lineaId]||0)+v}
  const planAt=d=>lines.reduce((s,l)=>s+planLine(l,d),0);
  const planToday=planAt(TODAY);
  const L=lines.map(l=>{const pt=planLine(l,TODAY),sp=spent[l.id]||0;return {l,plan:pt,spent:sp,saldo:(+l.monto||0)-sp,end:lineEnd(l)}});
  const cats={};for(const x of L){const k=x.l.cat||"Otros";const c=cats[k]||(cats[k]={cat:k,monto:0,plan:0,spent:0,items:[]});c.monto+=+x.l.monto||0;c.plan+=x.plan;c.spent+=x.spent;c.items.push(x)}
  const win=Math.min(90,Math.max(1,elapsed)),from=new Date(TODAY.getTime()-win*DAY);
  const recent=gastos.filter(g=>{const d=toD(g.fecha);return d>from&&d<=TODAY}).reduce((s,g)=>s+(+g.monto||0),0);
  const rate=Math.max(0,recent/win*0.6+actual/Math.max(1,elapsed)*0.4);
  const projected=Math.min(total,actual+rate*remaining);
  const left=Math.max(0,total-actual);
  const lost=ended?left:Math.max(0,total-projected);
  const needMonth=remaining>0?left/(remaining/30.44):left;
  const noData=!gastos.length;
  const timePct=elapsed/span,moneyPct=total?actual/total:0,planPct=total?planToday/total:0;
  const gap=planToday-actual;

}

function alertsFor(p,m){

  if(!m.noData&&!m.ended&&m.lost>m.total*.03)A.push({key:k("lost"),sev:m.lost>m.total*.15?"crit":"warn",t:"A este ritmo se perderían "+money(m.lost),d:"Proyección al cierre: "+money(m.projected)+" de "+money(m.total)+" ("+pct(m.projected/m.total)+")."});
  if(!m.ended&&m.remaining<=90&&m.left>0)A.push({key:k("close"),sev:"crit",t:"Cierre del convenio en "+m.remaining+" días",d:"Quedan "+money(m.left)+" por ejecutar antes del "+fmtD(p.fin)+"."});
  // por cuenta
  for(const x of m.L){const M=+x.l.monto||0;if(!M)continue;
    if(x.end<TODAY&&x.saldo>M*.05)A.push({key:k("le"+x.l.id),sev:"crit",t:"«"+x.l.nombre+"» con plazo cumplido y saldo",d:"Su plan terminó el "+fmtD(iso(x.end))+" y quedan "+money(x.saldo)+" sin ejecutar ("+x.l.cat+")."});

    if(x.spent>M*1.02)A.push({key:k("lo"+x.l.id),sev:"warn",t:"«"+x.l.nombre+"» sobre su presupuesto",d:"Ejecutado "+money(x.spent)+" de "+money(M)+". CORFO puede rechazar el exceso."});
    if(x.l.plan&&x.l.plan.tipo==="cuotas"){const nx=m.cuotaDates(x.l).find(d=>d>=TODAY);if(nx&&days(TODAY,nx)<=45)A.push({key:k("cu"+x.l.id+iso(nx)),sev:"info",t:"Cuota de «"+x.l.nombre+"» el "+fmtD(iso(nx)),d:"Corresponde cargar "+money((+x.l.monto||0)/Math.max(1,x.l.plan.n|0))+" al proyecto."})}
  }
  // actividades
  for(const a of p.actividades||[]){const f=toD(a.fin),i=toD(a.inicio);if(!f||!i)continue;const av=+a.avance||0;
    if(f<TODAY&&av<100)A.push({key:k("al"+a.id),sev:"warn",t:"Actividad "+a.id+" vencida al "+av+"%",d:"«"+a.nombre+"» terminaba el "+fmtD(a.fin)+"."});
    else if(i<=TODAY&&f>=TODAY){const exp=(days(i,TODAY)+1)/(days(i,f)+1);if(exp-av/100>.35)A.push({key:k("as"+a.id),sev:"info",t:"Actividad "+a.id+" con avance bajo",d:"Lleva "+pct(exp)+" de su plazo y "+av+"% de avance registrado."})}
  }
  const pend=(p.gastos||[]).filter(g=>g.estado!=="Rendido");
  if(pend.length)A.push({key:k("rend"),sev:"info",t:pend.length+" gasto"+(pend.length>1?"s":"")+" sin rendir",d:"Por "+money(pend.reduce((s,g)=>s+(+g.monto||0),0))+". Adjunta respaldos antes del próximo informe."});
  if(!m.ended&&m.left>0)A.push({key:k("pace"),sev:"info",t:"Ritmo necesario: "+money(m.needMonth)+" al mes",d:"Para ejecutar el 100% antes del "+fmtD(p.fin)+"."+(m.noData?"":" Ritmo actual: "+money(m.rate*30.44)+" al mes.")});
  const o={crit:0,warn:1,info:2};A.sort((a,b)=>o[a.sev]-o[b.sev]);
  return A;
}

  const todayGap=(m.planToday-acc>m.total*.02&&TODAY<=m.E)?`<line x1="${x(TODAY)}" x2="${x(TODAY)}" y1="${y(m.planToday)}" y2="${y(acc)}" stroke="var(--crit)" stroke-width="5" opacity=".3"/><text x="${x(TODAY)+8}" y="${(y(m.planToday)+y(acc))/2+4}" font-size="11" fill="var(--crit)" font-family="var(--f-mono)">atraso ${mshort(m.planToday-acc)}</text>`:"";
  const yt=[0,.25,.5,.75,1].map(f=>f*m.total).map(v=>`<line x1="${Lm}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${Lm-8}" y="${y(v)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" font-family="var(--f-mono)">${mshort(v)}</text>`).join("");
  let xt="";const mm=new Date(m.S.getFullYear(),m.S.getMonth()+1,1);const months=[];while(mm<=m.E){months.push(new Date(mm));mm.setMonth(mm.getMonth()+1)}
  const every=Math.max(1,Math.ceil(months.length/10));months.forEach((d,i)=>{if(i%every)return;xt+=`<text x="${x(d)}" y="${H-10}" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="var(--f-body)">${MES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}</text>`});
  const todayL=(TODAY>=m.S&&TODAY<=m.E)?`<line x1="${x(TODAY)}" x2="${x(TODAY)}" y1="${T}" y2="${T+h}" stroke="var(--fg)" stroke-width="1" stroke-dasharray="3 3" opacity=".5"/><text x="${x(TODAY)+5}" y="${T+10}" font-size="10.5" fill="var(--fg)" font-family="var(--f-body)" font-weight="500">Hoy</text>`:"";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ejecución acumulada frente al plan del presupuesto">
  ${yt}<line x1="${Lm}" x2="${W-R}" y1="${y(m.total)}" y2="${y(m.total)}" stroke="var(--fg)" stroke-width="1.5"/><text x="${W-R}" y="${y(m.total)-6}" text-anchor="end" font-size="10.5" fill="var(--fg)" font-weight="500" font-family="var(--f-body)">100% del presupuesto</text>
  <path d="${plan}" stroke="var(--faint)" stroke-width="1.8" fill="none" stroke-dasharray="5 4"/>
  <path d="${area}" fill="var(--copper)" opacity=".14"/><path d="${act}" stroke="var(--copper)" stroke-width="2.4" fill="none" stroke-linejoin="round"/>
  ${proj}${gapMark}${todayGap}${todayL}<circle cx="${tx}" cy="${y(acc)}" r="4.5" fill="var(--copper)" stroke="#fff" stroke-width="2"/>
  ${xt}</svg>`;
}

function planLabel(l,m){const t=(l.plan||{}).tipo;
  if(t==="gantt")return "Según carta Gantt";
  if(t==="cuotas")return (l.plan.n||1)+" cuota"+((l.plan.n|0)>1?"s":"")+" anual"+((l.plan.n|0)>1?"es":"")+" desde "+fmtM(l.plan.primera||iso(m.S));
  if(t==="unico")return "Pago único "+fmtD(l.plan.fecha);
  return "Mensual "+fmtM(l.plan&&l.plan.desde||iso(m.S))+" → "+fmtM(l.plan&&l.plan.hasta||iso(m.E))}
function presupuestoTab(p,m){
  const order=CATS.concat(Object.keys(m.cats).filter(c=>!CATS.includes(c)));

    return `<tr class="cat ${isC?"collapsed":""}" data-cat="${esc(k)}"><td><span class="chev">▾</span> ${esc(c)} <span class="subtle num" style="font-weight:400">· ${C.items.length}</span></td><td class="subtle" style="font-weight:400;font-size:12px">${CORRIENTES.has(c)?"Gasto corriente":"Inversión"}</td><td class="r num">${money(C.monto)}</td><td class="r num">${money(C.plan)}</td><td class="r num">${money(C.spent)}</td><td>${miniBar(C.spent,C.monto,C.plan)}</td><td class="r num">${money(C.monto-C.spent)}</td><td></td></tr>`+

  ${(p.excluidos||[]).length?`<div class="note" style="margin-bottom:12px">No cuentan en el presupuesto (el Excel no les asigna valor con cargo al proyecto): ${esc(p.excluidos.join("; "))}.</div>`:""}

  :`<div class="empty" style="padding:32px"><p>Agrega las cuentas del presupuesto con su monto y cómo se planifica su gasto.</p></div>`}`;

function ganttTab(p,m){
  const acts=(p.actividades||[]).slice().sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true}));
  const pos=d=>clamp(days(m.S,d)/m.span,0,1)*100;
  let ticks="",grid="";
  const mm=new Date(m.S.getFullYear(),m.S.getMonth(),1);let i=0,lastP=-99;
  while(mm<=m.E){const p0=pos(mm<m.S?m.S:mm);if(mm.getMonth()===0||i===0){ticks+=`<span style="left:${Math.max(p0,2)}%;font-weight:700;color:var(--fg)">${mm.getFullYear()}</span>`;grid+=`<span class="ygrid" style="left:${p0}%"></span>`;lastP=Math.max(p0,2)}else if(mm.getMonth()%3===0&&p0-lastP>4){ticks+=`<span style="left:${p0}%">${MES[mm.getMonth()]}</span>`;lastP=p0}mm.setMonth(mm.getMonth()+1);i++}
  const todayL=(TODAY>=m.S&&TODAY<=m.E)?`<span class="today" style="left:${pos(TODAY)}%"></span>`:"";
  const objs=(p.objetivos||[]).slice().sort((a,b)=>a.n-b.n);
  const groups=objs.length?objs.map(o=>({o,list:acts.filter(a=>+a.obj===+o.n)})):[{o:null,list:acts}];
  const orphan=objs.length?acts.filter(a=>!objs.some(o=>+o.n===+a.obj)):[];if(orphan.length)groups.push({o:{n:"",nombre:"Sin objetivo"},list:orphan});
  const row=a=>{const s=toD(a.inicio),f=toD(a.fin);const av=clamp(+a.avance||0,0,100);
    const st=av>=100?"done":(f&&f<TODAY?"late":(s&&s>TODAY?"future":""));
    const l=s?pos(s):0,r=f?pos(new Date(f.getTime()+DAY)):l+2;
    const pill=av>=100?`<span class="pill ok">Lista</span>`:st==="late"?`<span class="pill crit">${av}%</span>`:st==="future"?`<span class="pill mute">Pendiente</span>`:`<span class="pill info">${av}%</span>`;
    return `<div class="grow"><div class="tn">${esc(a.id)} · ${esc(a.nombre)}<small>${fmtD(a.inicio)} → ${fmtD(a.fin)}${+a.horas?" · "+(+a.horas).toLocaleString("es-CL")+" h":""}</small></div>
    <div class="lane">${grid}<button class="tbar ${st}" data-a="${esc(a.id)}" style="left:${l}%;width:${Math.max(1,r-l)}%" title="Editar avance de ${esc(a.id)}"><i style="width:${av}%"></i></button>${todayL}</div><div style="text-align:right">${pill}</div></div>`};
  const body=groups.map(g=>(g.o?`<div class="gobj">${g.o.n!==""?"Objetivo "+esc(g.o.n):""}<span>${esc(g.o.nombre)}</span></div>`:"")+g.list.map(row).join("")).join("");
  const done=acts.filter(a=>(+a.avance||0)>=100).length,late=acts.filter(a=>toD(a.fin)<TODAY&&(+a.avance||0)<100).length;
  return `<div class="panel-h" style="margin-bottom:10px"><span class="subtle">${acts.length} actividades · ${done} listas · <span style="color:${late?"var(--crit)":"inherit"}">${late} vencidas sin terminar</span>. Haz clic en una barra para registrar el avance. Las horas de cada actividad reparten el gasto de remuneraciones en el tiempo.</span><button class="btn sm primary" id="addA">+ Nueva actividad</button></div>
  ${acts.length?`<div class="gantt"><div class="gin"><div class="ghead"><span>Actividad</span><div class="months">${ticks}</div><span style="text-align:right">Avance</span></div>${body}</div></div>`:`<div class="empty" style="padding:32px"><p>Agrega las actividades de la carta Gantt con sus fechas y horas.</p></div>`}`;
}

function modal(title,fields,onSave,onDelete,extra){
  const layer=$("#layer");
  const opt=(f,o)=>{if(o&&o.group)return `<optgroup label="${esc(o.group)}">${o.items.map(x=>opt(f,x)).join("")}</optgroup>`;const v=typeof o==="object"?o.v:o,l=typeof o==="object"?o.l:o;return `<option value="${esc(v)}" ${String(f.v??"")===String(v)?"selected":""}>${esc(l)}</option>`};
  layer.innerHTML=`<div class="scrim" id="scrim"><form class="modal" id="mform" novalidate><h3>${esc(title)}</h3>${extra||""}<div class="form">
  ${fields.map(f=>`<div class="field ${f.full?"full":""}" data-fk="${f.k}" ${f.hidden?"hidden":""}><label for="f_${f.k}">${esc(f.l)}</label>${
    f.type==="select"?`<select id="f_${f.k}">${f.opts.map(o=>opt(f,o)).join("")}</select>`
    :f.type==="textarea"?`<textarea id="f_${f.k}" rows="${f.rows||3}">${esc(f.v)}</textarea>`
    :`<input id="f_${f.k}" type="${f.type||"text"}" value="${esc(f.v??"")}" ${f.list?`list="dl_${f.k}"`:""} ${f.type==="number"?`min="0" step="${f.step||"1"}" inputmode="decimal"`:""} ${f.max?`max="${f.max}"`:""}>${f.list?`<datalist id="dl_${f.k}">${f.list.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`:""}`
  }${f.hint?`<span class="hint">${esc(f.hint)}</span>`:""}</div>`).join("")}
  </div><div class="ferr" id="ferr"></div><div class="mfoot">${onDelete?`<button type="button" class="btn danger" id="mdel">Eliminar</button>`:""}<div class="right"><button type="button" class="btn ghost" id="mcancel">Cancelar</button><button type="submit" class="btn solid">Guardar</button></div></div></form></div>`;
  const close=()=>{layer.innerHTML=""};
  $("#mcancel").onclick=close;
  $("#scrim").addEventListener("mousedown",e=>{if(e.target.id==="scrim")close()});
  const kh=e=>{if(e.key==="Escape"){close();document.removeEventListener("keydown",kh)}};document.addEventListener("keydown",kh);
  const first=layer.querySelector("input,select");if(first)first.focus();
  if(onDelete){const d=$("#mdel");d.onclick=()=>{if(d.dataset.c){onDelete();close()}else{d.dataset.c="1";d.textContent="Confirmar eliminación"}}}
  $("#mform").onsubmit=e=>{e.preventDefault();const v={};fields.forEach(f=>{const el=$("#f_"+f.k);v[f.k]=f.type==="number"?(parseFloat(el.value)||0):el.value.trim()});
    const miss=fields.find(f=>f.req&&!$(`[data-fk="${f.k}"]`).hidden&&!v[f.k]);if(miss){$("#ferr").textContent="Completa «"+miss.l+"».";$("#f_"+miss.k).focus();return}
    const err=onSave(v);if(err){$("#ferr").textContent=err;return}close()};
}

function parseDateLoose(s){s=String(s||"").trim();let m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return y+"-"+pad(m[2])+"-"+pad(m[1])}m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);return ""}
function parseMoney(s){s=String(s||"").replace(/[$\s]/g,"");if(/,\d{1,2}$/.test(s))s=s.replace(/\./g,"").replace(",",".");else s=s.replace(/[.,]/g,"");const n=parseFloat(s);return isFinite(n)?n:NaN}

  ],v=>{const rows=v.texto.split(/\r?\n/).map(r=>r.split("\t").map(x=>x.trim())).filter(r=>r.join("").length);

    if(!ok.length)return "No se reconoció ninguna fila. Revisa que la primera columna sea la fecha y la segunda el monto.";

  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY"){recovering=true;USER=session&&session.user;showAuth("recovery")}});
  const {data}=await sb.auth.getSession();
  if(recovering&&data.session){USER=data.session.user;showAuth("recovery");return}
  if(location.hash)history.replaceState(null,"",location.pathname);
  if(data.session)enterApp(data.session);else showAuth("login");
})();
})();
</script>

</body></html>
